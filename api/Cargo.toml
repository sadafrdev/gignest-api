[package]
name = "api"
version = "0.1.0"
edition = "2024"

[dependencies]
utils = { path = "../lib/utils" }
lib_freelancers = { path = "../lib/freelancers" }
lib_clients = { path = "../lib/clients" }
lib_authentication = { path = "../lib/authentication" }

serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["postgres", "chrono", "runtime-tokio"] }
axum = "0.8.7"
tokio = { version = "1", features = ["full"] }
anyhow = "1"
dotenv = "0.15.0"
dotenvy = "0.15.0"