[package]
name = "clients"
version = "0.1.0"
edition = "2024"

[dependencies]
lib = { path = "../lib" }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["postgres", "chrono", "runtime-tokio"] }
axum = "0.8.7"
tokio = { version = "1", features = ["full"] }