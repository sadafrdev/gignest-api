[package]
name = "clients"
version = "0.1.0"
edition = "2024"

[dependencies]
utils = { path = "../utils" }
sqlx = { version = "0.8.6", features = ["postgres", "chrono", "runtime-tokio", "bigdecimal"] }
axum = "0.8.7"
serde = { version = "1.0", features = ["derive"] }
anyhow = "1"
serde_json = "1"
bigdecimal = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
dotenv = "0.15.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["serde", "v4"] }
validator = { version = "0.20.0", features = ["derive"] }
bcrypt = "0.12.0"
jsonwebtoken = "8.2.0"
rand = "0.8.5"
reqwest = { version = "0.11", features = ["json"] }
thiserror = "1.0"
time = "0.3"
sha2 = "0.10"