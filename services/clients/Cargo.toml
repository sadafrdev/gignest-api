[package]
name = "clients"
version = "0.1.0"
edition = "2024"

[dependencies]
libs = { path = "../../libs" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8.6", features = ["postgres", "runtime-tokio", "macros", "bigdecimal"] }
bigdecimal = { version = "0.4", features = ["serde"] }
axum = "0.8.7"
tokio = { version = "1", features = ["full"] }